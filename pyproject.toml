[project]
name = "azure-ai-redteam-eval"
version = "0.1.0"
description = "Continuous Evaluation & Monitoring for AI Applications — demo repo for a 15-minute talk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Multi-Agent Framework
    "agent-framework-azure-ai>=1.0.0rc2",
    "agent-framework-core>=1.0.0rc2",
    # Azure SDKs
    "azure-identity>=1.25.3",
    # Pinned exactly: metric key names differ between versions, which breaks the baseline diff.
    "azure-ai-evaluation[redteam]==1.18.5",
    # openai is transitive but pinned: the 2.x -> 3.x metric-key rename must match local and CI.
    "openai==3.6.0",
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.27.0",
    # Observability — pinned together; azure-monitor 1.8.6 requires opentelemetry-sdk 1.39.x
    "opentelemetry-api==1.39.0",
    "opentelemetry-sdk==1.39.0",
    "azure-monitor-opentelemetry==1.8.6",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    # Config
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "pyright>=1.1.411",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

# ---------- Pyright ----------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = ["src/agents"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
